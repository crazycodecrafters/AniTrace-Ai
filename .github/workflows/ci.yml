name: AniTrace AI CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Code Quality, Security & Automated Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify Code Quality (ESLint)
        run: npm run lint

      - name: Verify TypeScript Types (tsc)
        run: npx tsc --noEmit

      - name: Run Automated Unit, Integration & A11y Tests
        run: npm run test

      - name: Production Build & Asset Bundle Check
        run: npm run build
